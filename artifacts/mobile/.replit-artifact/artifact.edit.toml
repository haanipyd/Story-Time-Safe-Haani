kind = "mobile"
previewPath = "/"
title = "Storytime - Kids Audio App"
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "sh", "-c", "node scripts/build.js" ]
run = [ "sh", "-c", "node server/serve.js" ]

[services.env]
PORT = "18115"
BASE_PATH = "/"
